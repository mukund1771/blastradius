[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blastradius"
version = "0.1.0"
description = "Intent-aware change-impact agent: crawl a live app, ingest its spec, graph requirements/UI/code, and report a PR's blast radius."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.13",
  "pydantic>=2.7",
  "httpx>=0.28",
  "playwright>=1.55",
  "neo4j>=6.0",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "tree-sitter>=0.25",
  "tree-sitter-typescript>=0.23",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
blastradius = "blastradius.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: integration tests that use the real cached repo clone or the network"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
