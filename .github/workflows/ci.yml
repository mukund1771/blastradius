name: tests

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/blastradius-local
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p blastradius-local 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Fast tests
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: blastradius-local
          PYTHONPATH: src
        run: python -m pytest -m "not slow"
