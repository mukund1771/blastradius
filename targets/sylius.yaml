# Second target (D15, cases 20, 73, 75): Sylius v2 demo slice. Evidence for every value is in docs/RECON.md
# section 4. Nothing in core names this target: `blastradius ingest|crawl|index -t sylius` read this file only.
name: sylius
display_name: Sylius
base_url: https://v2.demo.sylius.com
notes: >
  Server-rendered Twig + Symfony Live Components behind Cloudflare (no challenge seen, robots.txt has no
  Disallow). Guest browsing only: taxon list, product page, cart. The deployed version is unresolved (footer
  markup predates 2.2 HEAD), so the code index is `2.2` and PRs are indexed at their base SHA (#19187 base
  64360308fa6b, #19170 base e541c8c5ce25): a post-hoc check, not a prediction.

crawl:
  seed_urls:
    - https://v2.demo.sylius.com/en_US/
    - https://v2.demo.sylius.com/en_US/taxons/t-shirts/men
    - https://v2.demo.sylius.com/en_US/products/lunar-echo-t-shirt
    - https://v2.demo.sylius.com/en_US/cart/
  egress_allow:
    - v2.demo.sylius.com
  max_actions: 30
  max_depth: 3
  wall_clock_s: 300
  action_delay_ms: 1000
  viewport: [1280, 800]
  locale: en-US
  timezone: UTC
  block_service_workers: true
  allow_local_writes: false
  dismiss_selectors:
    - "button.btn-close[data-bs-dismiss='alert']"
  # Regexes on the full URL. Everything that authenticates, buys, mutates the session (locale and currency
  # switches are GET links that set it) or talks to the live-component endpoint is never navigated to.
  deny_url_patterns:
    - "^https://v2\\.demo\\.sylius\\.com/(admin|api)"
    - "^https://v2\\.demo\\.sylius\\.com/[^/]+/checkout"
    - "^https://v2\\.demo\\.sylius\\.com/[^/]+/(account|login|logout|register|order|payment-request)"
    - "^https://v2\\.demo\\.sylius\\.com/[^/]+/(forgotten-password|reset-password|verify)"
    - "^https://v2\\.demo\\.sylius\\.com/[^/]+/(switch-locale|switch-currency)"
    - "^https://v2\\.demo\\.sylius\\.com/[^/]+/(_components|_live)"
    - "^https://v2\\.demo\\.sylius\\.com/[^/]+/products/[^/]+/reviews/new"
  # The built-in floor already blocks delete/remove/clear/pay/purchase; these are the shop's own verbs.
  destructive_words:
    - delete
    - remove
    - clear
    - reset
    - sign out
    - log out
    - logout
    - revoke
    - deactivate
    - purchase
    - pay
    - add to cart
    - checkout
    - place order
    - complete
    - submit
    - send
    - apply coupon
    - subscribe
  anchor:
    title_regex: "(?i)(fashion web store|shopping cart)"
    min_interactive: 5

spec:
  kind: gherkin
  repo: Sylius/Sylius
  ref: "2.2"
  # Case 73: the Gherkin is the requirement source; docs.sylius.com/public/llms-full.txt is a cross-check only.
  paths:
    - features/shop/product
    - features/shop/cart
    - features/shop/homepage
    - features/shop/locale
    - features/shop/currency
    - features/shop/contact
  edition_default: all
  max_requirements: 300

code:
  repo: Sylius/Sylius
  ref: "2.2"
  adapter: twig
  roots:
    - src/Sylius/Bundle/ShopBundle/templates
    - src/Sylius/Bundle/ShopBundle/Resources/config
    - src/Sylius/Bundle/UiBundle/templates
    # mounts the shop routing under the `/{_locale}` prefix (the demo serves `/en_US/...`)
    - config/routes
  # Catalogues in Symfony's bundle order: a later file overrides an earlier one. Admin copy is not shop UI.
  locale_files:
    - src/Sylius/Bundle/AddressingBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/AttributeBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/ChannelBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/CoreBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/CurrencyBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/CustomerBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/LocaleBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/PaymentBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/PayumBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/ProductBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/PromotionBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/ReviewBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/ShippingBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/TaxationBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/TaxonomyBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/UserBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/UiBundle/Resources/translations/messages.en.yml
    - src/Sylius/Bundle/ShopBundle/Resources/translations/messages.en.yml
  global_files:
    - src/Sylius/Bundle/ShopBundle/templates/shared/layout/base.html.twig
  hub_packages: []
  # Twig bundle namespaces -> template directories (Symfony's `@<Bundle>/` convention, Sylius v2 layout).
  alias:
    "@SyliusShop/": src/Sylius/Bundle/ShopBundle/templates/
    "@SyliusUi/": src/Sylius/Bundle/UiBundle/templates/
